<svg xmlns="http://www.w3.org/2000/svg" width="420" height="155" viewBox="0 0 420 155" role="img" aria-label="GPS MAP: Location-aware mapping for remote terrain and ski resorts.">
<title>GPS MAP: Location-aware mapping for remote terrain and ski resorts.</title>
<style>
text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
.blink { animation: blink 1.4s steps(1,end) infinite; }
.sweep { transform-origin: 50% 50%; animation: sweep 9s linear infinite; }
.plane { animation: fly 18s linear infinite; }
.ambient { animation: ambient 5s ease-in-out infinite; }
.metric-edge { animation: metric-edge 5s ease-in-out infinite; }
.arrow-drift { animation: arrow-drift 3.5s ease-in-out infinite; }
.month-focus { animation: month-focus 3s ease-in-out infinite; }
@keyframes blink { 50% { opacity: .2 } }
@keyframes sweep { to { transform: rotate(360deg) } }
@keyframes fly { from { transform: translateX(-100px) } to { transform: translateX(520px) } }
@keyframes ambient { 50% { opacity: .35; } }
@keyframes metric-edge { 0%,100% { stroke-opacity: .35; } 50% { stroke-opacity: 1; } }
@keyframes arrow-drift { 0%,35%,65%,100% { transform: translateX(0); } 50% { transform: translateX(7px); } }
@keyframes month-focus { 50% { stroke-opacity: .25; } }
@media (prefers-reduced-motion: reduce) { .blink,.sweep,.plane,.ambient,.metric-edge,.arrow-drift,.month-focus { animation: none; } }
</style>
<rect width="100%" height="100%" fill="#080c19"/>
<line x1="2.0" y1="0.0" x2="2.0" y2="155.0" stroke="#58e8ff" stroke-width="2" /><line x1="418.0" y1="0.0" x2="418.0" y2="155.0" stroke="#58e8ff" stroke-width="2" /><rect x="10.0" y="8.0" width="400.0" height="139.0" rx="6" fill="#111b2c" stroke="#c1f75a" /><rect x="10.0" y="8.0" width="5.0" height="139.0" rx="0" fill="#c1f75a" stroke="#c1f75a" /><text x="25.0" y="37.0" fill="#c1f75a" font-size="17" font-weight="800" text-anchor="start" >03  /  GPS MAP</text><text x="25.0" y="67.0" fill="#edf8ff" font-size="11" font-weight="400" text-anchor="start" >Location-aware mapping for remote terrain</text><text x="25.0" y="86.0" fill="#edf8ff" font-size="11" font-weight="400" text-anchor="start" >and ski resorts.</text><text x="25.0" y="126.0" fill="#ffae58" font-size="10" font-weight="700" text-anchor="start" >POSTGIS · LEAFLET · SWIFT</text><text x="393.0" y="37.0" fill="#c1f75a" font-size="21" font-weight="700" text-anchor="end" class="arrow-drift" style="animation-delay:-4.5s">↗</text>
</svg>