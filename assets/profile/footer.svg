<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="122" viewBox="0 0 1000 122" role="img" aria-label="End of transmission; console design credit to Giorgi Kobaidze">
<title>End of transmission; console design credit to Giorgi Kobaidze</title>
<style>
text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
.blink { animation: blink 1.4s steps(1,end) infinite; }
.sweep { transform-origin: 50% 50%; animation: sweep 9s linear infinite; }
.plane { animation: fly 18s linear infinite; }
.ambient { animation: ambient 5s ease-in-out infinite; }
.metric-edge { animation: metric-edge 5s ease-in-out infinite; }
.arrow-drift { animation: arrow-drift 3.5s ease-in-out infinite; }
.month-focus { animation: month-focus 3s ease-in-out infinite; }
@keyframes blink { 50% { opacity: .2 } }
@keyframes sweep { to { transform: rotate(360deg) } }
@keyframes fly { from { transform: translateX(-100px) } to { transform: translateX(1100px) } }
@keyframes ambient { 50% { opacity: .35; } }
@keyframes metric-edge { 0%,100% { stroke-opacity: .35; } 50% { stroke-opacity: 1; } }
@keyframes arrow-drift { 0%,35%,65%,100% { transform: translateX(0); } 50% { transform: translateX(7px); } }
@keyframes month-focus { 50% { stroke-opacity: .25; } }
@media (prefers-reduced-motion: reduce) { .blink,.sweep,.plane,.ambient,.metric-edge,.arrow-drift,.month-focus { animation: none; } }
</style>
<rect width="100%" height="100%" fill="#080c19"/>
<line x1="2.0" y1="0.0" x2="2.0" y2="122.0" stroke="#58e8ff" stroke-width="2" /><line x1="998.0" y1="0.0" x2="998.0" y2="122.0" stroke="#58e8ff" stroke-width="2" /><line x1="2.0" y1="120.0" x2="998.0" y2="120.0" stroke="#58e8ff" stroke-width="2" /><line x1="24.0" y1="16.0" x2="976.0" y2="16.0" stroke="#284555" stroke-width="1" /><text x="24.0" y="55.0" fill="#58e8ff" font-size="17" font-weight="700" text-anchor="start" >END OF TRANSMISSION // 73</text><text x="24.0" y="84.0" fill="#a3b5c8" font-size="13" font-weight="400" text-anchor="start" >Console inspired by Giorgi Kobaidze.</text>
</svg>